name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test ./...
      - run: go tool mygo vet .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            slug: darwin-universal
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool mygo build -platform ${{ matrix.platform }}
        env:
          # Signs the update archives and writes the update-<target>.json
          # manifests that mygo.Updater checks (updates in mygo.json).
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.slug }}
          path: build/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aurora-*
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          ls -laR
          shopt -s nullglob globstar
          # Only the installers and the update files: **/*.exe would also
          # catch the bare Aurora.exe.
          files=(**/*.dmg **/*-setup-*.exe **/*.deb **/*.tar.gz **/update-*.json **/*.delta)
          echo "release files: ${files[@]}"
          if ! out=$(gh release create "${{ github.ref_name }}" "${files[@]}" --title "Aurora ${{ github.ref_name }}" --generate-notes 2>&1); then
            printf '### Release failed\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
