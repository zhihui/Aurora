name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test ./...
      - run: go tool mygo vet .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            slug: darwin-universal
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool mygo build -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.slug }}
          path: build/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aurora-*
          merge-multiple: true
      - run: gh release create ${{ github.ref_name }} * --title "Aurora ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
